spring:
  application:
    name: ms-inventario

server:
  port: 8091

management:
  health:
    ratelimiters:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,ratelimiters,ratelimiterevents
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  ratelimiter:
    instances:
      inventario:
        registerHealthIndicator: true
        limitForPeriod: 3
        limitRefreshPeriod: 10s
        timeoutDuration: 0
