services:

  ms-inventario:
    build:
      context: ./ms-inventario
    container_name: ms-inventario
    ports:
      - "8091:8091"
    networks:
      - resiliencia-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-pedidos:
    build:
      context: ./ms-pedidos
    container_name: ms-pedidos
    ports:
      - "8090:8090"
    environment:
      - INVENTARIO_BASE_URL=http://ms-inventario:8091
    depends_on:
      ms-inventario:
        condition: service_healthy
    networks:
      - resiliencia-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - resiliencia-net
    depends_on:
      ms-inventario:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - resiliencia-net
    depends_on:
      - prometheus

networks:
  resiliencia-net:
    driver: bridge
