global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ms-pedidos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'ms-pedidos:8090' ]

  - job_name: ms-inventario
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'ms-inventario:8091' ]
